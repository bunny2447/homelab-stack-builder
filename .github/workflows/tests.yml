name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches renamed images and removed Proxmox helper scripts
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catalog, generator and registry checks
        run: node tests/run.js --compose --images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
